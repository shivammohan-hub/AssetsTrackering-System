<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssetsTracker | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        form > p {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        form > p > label {
            font-size: 16px;
            font-weight: 600;
            color: rgb(51 65 85);
        }

        form > p > input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid rgb(226 232 240);
            border-radius: 8px;
            background-color: white;
            color: rgb(51 65 85);
            font-size: 14px;
            outline: none;
        }
</style>
</head>
<body class="bg-slate-50">

    <header class="bg-white border-b border-slate-200 px-32">
        <div class="py-6 flex items-center justify-between">
            <a href="" class="text-4xl font-bold text-teal-700 tracking-wider">ꍏꌗꌗꍟ꓄ꌗ<span class="text-slate-700">꓄ꋪꍏꉓꀘꍟꋪ</span></a>
            <div class="flex items-center gap-10 font-medium">
                <a href="{% url "user:home" %}" class="text-sm text-slate-500 hover:text-teal-700">← Back to Home</a>
                <a href="{% url 'manager:manager-login' %}" class="text-sm w-44 flex items-center gap-2 font-semibold text-slate-500 hover:text-teal-700">
                    <svg width="12%" height="12%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.3163 19.4384C5.92462 18.0052 7.34492 17 9 17H15C16.6551 17 18.0754 18.0052 18.6837 19.4384M16 9.5C16 11.7091 14.2091 13.5 12 13.5C9.79086 13.5 8 11.7091 8 9.5C8 7.29086 9.79086 5.5 12 5.5C14.2091 5.5 16 7.29086 16 9.5ZM22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Manager Login</span></a>
            </div>
        </div>
    </header>

    <div class="flex items-center justify-center py-12">
            <div class="p-12 flex items-center bg-white shadow-lg w-[30%] rounded-xl">
                <div class="w-full">
                    <div class="mb-6">
                        <p class="text-teal-600 text-sm font-medium">WELCOME BACK</p>
                        <h2 class="text-3xl font-semibold text-slate-900 mt-2">Sign in to AssetsTracker</h2>
                        <p class="text-slate-500 text-sm tracking-wider mt-2">A Smart Assets Management & Tracking System</p>
                    </div>

                    <form method="POST">
                    {% csrf_token %}

                        {{loginForm.as_p}}

                        <input class="w-full bg-teal-600 text-white py-3 rounded-lg font-semibold hover:bg-teal-700" type="submit" value="Sign in">
                    </form>

                    <p class="text-center text-sm text-slate-400 mt-10">
                        © 2026 AssetsTracker. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
