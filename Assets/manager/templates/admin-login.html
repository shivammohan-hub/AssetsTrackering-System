<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssetsTracker | Manager Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        form > p {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        form > p > label {
            font-size: 16px;
            font-weight: 600;
            color: rgb(51 65 85);
        }

        form > p > input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid rgb(226 232 240);
            border-radius: 8px;
            background-color: white;
            color: rgb(51 65 85);
            font-size: 14px;
            outline: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

<header class="bg-white border-b border-slate-200 px-32">
    <div class="py-6 flex items-center justify-between">
        <a href="" class="text-4xl font-bold text-teal-700 tracking-wider">ꍏꌗꌗꍟ꓄ꌗ<span class="text-slate-700">꓄ꋪꍏꉓꀘꍟꋪ</span></a>
        <div class="flex items-center gap-10 font-medium">
            <a href="{% url "user:home" %}" class="text-sm text-slate-500 hover:text-teal-700">← Back to Home</a>
            <a href="{% url 'user:login' %}" class="text-sm w-44 flex items-center gap-1 font-semibold text-slate-500 hover:text-teal-700">
                <svg width="10%" height="10%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 15.8369C19.4559 16.5683 20.7041 17.742 21.6152 19.2096C21.7956 19.5003 21.8858 19.6456 21.917 19.8468C21.9804 20.2558 21.7008 20.7585 21.3199 20.9204C21.1325 21 20.9216 21 20.5 21M16 11.5322C17.4817 10.7959 18.5 9.26686 18.5 7.5C18.5 5.73314 17.4817 4.20411 16 3.46776M14 7.5C14 9.98528 11.9852 12 9.49996 12C7.01468 12 4.99996 9.98528 4.99996 7.5C4.99996 5.01472 7.01468 3 9.49996 3C11.9852 3 14 5.01472 14 7.5ZM2.55919 18.9383C4.1535 16.5446 6.66933 15 9.49996 15C12.3306 15 14.8464 16.5446 16.4407 18.9383C16.79 19.4628 16.9646 19.725 16.9445 20.0599C16.9289 20.3207 16.7579 20.64 16.5495 20.7976C16.2819 21 15.9138 21 15.1776 21H3.82232C3.08613 21 2.71804 21 2.4504 20.7976C2.24201 20.64 2.07105 20.3207 2.05539 20.0599C2.03529 19.725 2.20992 19.4628 2.55919 18.9383Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>User Login</span></a>
            </div>
        </div>
    </header>

    <div class="flex items-center justify-center px-8 py-12">
        <div class=" w-[35%] bg-white shadow-lg rounded-xl p-12">
            <div class="mb-7">
                <p class="text-teal-600 text-2xl font-bold mt-2 tracking-widest">MANAGER PORTAL</p>
                <p class="text-slate-500 mt-2 text-sm tracking-wider">Sign in to manage your organization's assets</p>
            </div>

            <form method="POST" class="">
                {% csrf_token %}

                {{loginForm.as_p}}

                <input class="w-full bg-teal-600 text-center text-white py-3 rounded-lg font-bold hover:bg-teal-700" type="submit" value="Login as Manager">

            </form>

            <div class="text-center mt-10">
                <a href="" class="text-sm text-slate-500 hover:text-teal-600 tracking-widest">2026 @AssetsTracker</a>
            </div>

        </div>
    </div>
</body>
</html>
